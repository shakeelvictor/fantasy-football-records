  <meta name="color-scheme" content="light dark" />
  <!-- Resolve the theme before first paint so the page never flashes the wrong
       one. Mirrors theme.js; kept inline because a separate file would load too
       late to help. -->
  <script>
    (function () {
      var mode = 'system';
      try {
        var v = localStorage.getItem('fflr-theme');
        if (v === 'light' || v === 'dark') mode = v;
      } catch (e) {}
      var dark = mode === 'dark' || (mode === 'system' &&
        window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
