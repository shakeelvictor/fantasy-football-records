name: Weekly league update

on:
  schedule:
    # Thursday morning: after Monday night football and after MFL's stat
    # corrections have landed, matching how the league already validates
    # weekly winners. Off the hour deliberately — top-of-hour runs contend
    # for shared runners.
    #
    # This is UTC. 13:23 UTC is 08:23 CDT during the season and 07:23 CST
    # after the November DST change — i.e. it drifts an hour, mid-playoffs,
    # but always lands Thursday morning, which is all this job needs.
    #
    # The build spec called for `timezone: America/Chicago` here. That key is
    # left out on purpose: an unrecognised key makes the whole workflow fail
    # to parse, and a silently dead scheduler is worse than an hour of drift.
    # If you confirm your GitHub plan supports it, add it and drop this note.
    - cron: '23 13 * * 4'
  workflow_dispatch:

# Only one update in flight at a time; a manual rerun should not race the cron.
concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No dependencies, so there is no lockfile for `npm ci` to install from.
      # Left as a no-op marker: add `npm ci` here the day this takes a dep.

      # A broken derivation should fail loudly rather than commit corrupted
      # records. Tests are offline — they replay checked-in fixtures.
      - run: npm test

      - run: npm run ingest
        env:
          MFL_API_KEY: ${{ secrets.MFL_API_KEY }}

      - name: Commit if changed
        run: |
          git config user.name "fflr-bot"
          git config user.email "fflr-bot@users.noreply.github.com"
          git add data/ weekly-log.js
          git diff --staged --quiet || git commit -m "Week update $(date +%F)"
          git push

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Weekly league update failed. The site is unchanged;"
          echo "::error::rerun via workflow_dispatch once the cause is fixed."
