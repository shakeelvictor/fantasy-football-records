name: Weekly league update

on:
  schedule:
    # Thursday AFTERNOON, deliberately.
    #
    # MFL posts stat corrections Thursday morning, and the league has treated
    # the post-correction numbers as the final tally since the MFL era began.
    # Running Thursday morning would race those corrections and could record a
    # weekly winner that MFL then revises — and weekly winners carry the
    # largest payout share, so that is a money question, not a cosmetic one.
    #
    # 19:23 UTC is 14:23 CDT through early November and 13:23 CST after the
    # DST change: several hours clear of the morning corrections in both, and
    # still Thursday, well before that night's kickoff. Off the hour because
    # top-of-hour runs contend for shared runners.
    #
    # The build spec called for `timezone: America/Chicago` here. That key is
    # left out on purpose: an unrecognised key makes the whole workflow fail
    # to parse, and a silently dead scheduler is worse than an hour of drift.
    # The afternoon slot is chosen so that drift cannot push the run back into
    # the correction window.
    - cron: '23 19 * * 4'
  workflow_dispatch:

# Only one update in flight at a time; a manual rerun should not race the cron.
concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history: the commit step rebases onto origin/main when the branch
      # has moved, and a depth-1 clone makes that unreliable. The repo is small.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No dependencies, so there is no lockfile for `npm ci` to install from.
      # Left as a no-op marker: add `npm ci` here the day this takes a dep.

      # A broken derivation should fail loudly rather than commit corrupted
      # records. Tests are offline — they replay checked-in fixtures.
      - run: npm test

      # Nothing below passes an MFL key. League 19716 serves its export
      # anonymously and no MFL_API_KEY secret has ever existed, so the four
      # steps that used to set it were passing an empty string. If MFL starts
      # requiring a key, add the secret and put `env:` back on ingest, records,
      # season-end and lineups — src/mfl/client.mjs reads it from the
      # environment and sends it only when it is set.
      - run: npm run ingest

      # Promotes any all-time record card this season has already beaten, so a
      # record broken in Week 3 shows up the same Thursday. Limited to the cards
      # that are monotone in weeks played — see the note on DEFINITIONS in
      # src/records.mjs. Reads the season file the ingest just wrote, so it runs
      # after it. No-ops before the first game of the year.
      - run: npm run records

      # Records the finished season into data.js — champion, playoff field,
      # Pakistan vs. the World, appearance counts and any all-time record the
      # season broke. No-ops until Week 18 has been played, and no-ops again
      # once the season is recorded, so it is safe to run every week.
      - run: npm run season-end

      # Lineup efficiency for the current season: what each manager started
      # against the best lineup his roster could legally have fielded. Current
      # season only — the historical archive under data/lineups/ is frozen and
      # rebuilt by hand with `npm run lineups --all`. Runs after the ingest so
      # a stat correction is reflected here too.
      - run: npm run lineups

      # Settles the money book. Offline — it reads the archive the step above
      # just wrote plus data.js, so it runs last and needs no MFL key.
      #
      # The season being played is settled but never reconciled: only weekly
      # money is decided until the Fantasy Bowl, so Weeks 15 and 16 add nothing
      # at all. The full-pot check fires the Thursday season-end records the
      # year, which is also when a payout structure carried forward wrongly
      # would fail loudly rather than publish a wrong number.
      - run: npm run payouts

      - name: Commit if changed
        run: |
          git config user.name "fflr-bot"
          git config user.email "fflr-bot@users.noreply.github.com"
          git add data/ weekly-log.js data.js lineups-data.js payouts-data.js

          # Nothing to record: stop here. Pushing anyway used to fail the whole
          # job whenever the local branch was behind for any reason at all —
          # including a re-run of an older run, which checks out the SHA the run
          # was created at, not the tip.
          if git diff --staged --quiet; then
            echo "No change this week; nothing to commit."
            exit 0
          fi

          git commit -m "Week update $(date +%F)"

          # main can move between checkout and push: a hand commit, the monthly
          # keepalive, a slow MFL fetch. Rebase this one data commit on top and
          # retry rather than dropping the week's results — weekly winners carry
          # the largest payout share, so a lost update is a money question, not
          # a cosmetic one. A genuine conflict still fails loudly below.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed; retrying."
            sleep 5
          done

          echo "::error::Week update committed but could not be pushed after 3 attempts."
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Weekly league update failed. The site is unchanged;"
          echo "::error::rerun via workflow_dispatch once the cause is fixed."
