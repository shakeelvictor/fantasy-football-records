name: Weekly league update

on:
  schedule:
    # Thursday AFTERNOON, deliberately.
    #
    # MFL posts stat corrections Thursday morning, and the league has treated
    # the post-correction numbers as the final tally since the MFL era began.
    # Running Thursday morning would race those corrections and could record a
    # weekly winner that MFL then revises — and weekly winners carry the
    # largest payout share, so that is a money question, not a cosmetic one.
    #
    # 19:23 UTC is 14:23 CDT through early November and 13:23 CST after the
    # DST change: several hours clear of the morning corrections in both, and
    # still Thursday, well before that night's kickoff. Off the hour because
    # top-of-hour runs contend for shared runners.
    #
    # The build spec called for `timezone: America/Chicago` here. That key is
    # left out on purpose: an unrecognised key makes the whole workflow fail
    # to parse, and a silently dead scheduler is worse than an hour of drift.
    # The afternoon slot is chosen so that drift cannot push the run back into
    # the correction window.
    - cron: '23 19 * * 4'
  workflow_dispatch:

# Only one update in flight at a time; a manual rerun should not race the cron.
concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No dependencies, so there is no lockfile for `npm ci` to install from.
      # Left as a no-op marker: add `npm ci` here the day this takes a dep.

      # A broken derivation should fail loudly rather than commit corrupted
      # records. Tests are offline — they replay checked-in fixtures.
      - run: npm test

      - run: npm run ingest
        env:
          MFL_API_KEY: ${{ secrets.MFL_API_KEY }}

      # Records the finished season into data.js — champion, playoff field,
      # Pakistan vs. the World, appearance counts and any all-time record the
      # season broke. No-ops until Week 18 has been played, and no-ops again
      # once the season is recorded, so it is safe to run every week.
      - run: npm run season-end
        env:
          MFL_API_KEY: ${{ secrets.MFL_API_KEY }}

      - name: Commit if changed
        run: |
          git config user.name "fflr-bot"
          git config user.email "fflr-bot@users.noreply.github.com"
          git add data/ weekly-log.js data.js
          git diff --staged --quiet || git commit -m "Week update $(date +%F)"
          git push

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Weekly league update failed. The site is unchanged;"
          echo "::error::rerun via workflow_dispatch once the cause is fixed."
