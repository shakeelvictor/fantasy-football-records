<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Records book">
  <!-- A records book in the league's own colours: field green, leather brown.
       Drawn for 16px first. An earlier pass sat a smaller book on the tile with
       three ruled lines; rasterised at 16 the margin ate the shape and the
       lower rules smeared into one grey band. The book now fills the tile and
       carries two rules, which is all that survives the pixel grid.

       Deliberately NOT theme-reactive. A prefers-color-scheme swap in here
       would put the OS back in charge of an asset the league picked, and the
       green tile already carries on a light or a dark tab bar. -->
  <rect width="64" height="64" rx="13" fill="#2d7a3e"/>
  <rect x="9" y="7" width="46" height="50" rx="3" fill="#f4f1e8"/>
  <path d="M12 7h9v50h-9a3 3 0 0 1-3-3V10a3 3 0 0 1 3-3z" fill="#7c4a25"/>
  <rect x="27" y="18" width="20" height="5" rx="2.5" fill="#2d7a3e"/>
  <rect x="27" y="31" width="20" height="4" rx="2" fill="#c4bba7"/>
</svg>
